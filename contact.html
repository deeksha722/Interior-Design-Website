<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Contact</title>

    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- External CSS -->

    <link rel="stylesheet"
    href="/static/css/style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">

            <a class="navbar-brand"
            href="index.html">

                DecorAI

            </a>

            <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
            id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link"
                        href="index.html">

                            Home

                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                        href="designs.html">

                            Designs

                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                        href="upload.html">

                            Upload

                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                        href="contact.html">

                            Contact

                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Contact Section -->

    <section class="contact-section">

        <div class="container">

            <div class="contact-box shadow-lg">

                <h2 class="mb-4">

                    Contact Us

                </h2>

                <!-- Form -->

                <form action="http://127.0.0.1:5000/contact"
                method="POST">

                    <!-- Name -->

                    <input type="text"
                    name="name"
                    class="form-control mb-3"
                    placeholder="Enter Your Name"
                    required>

                    <!-- Email -->

                    <input type="email"
                    name="email"
                    class="form-control mb-3"
                    placeholder="Enter Your Email"
                    required>

                    <!-- Message -->

                    <textarea
                    name="message"
                    class="form-control mb-3"
                    rows="5"
                    placeholder="Enter Your Message"
                    required></textarea>

                    <!-- Button -->

                    <button type="submit"
                    class="custom-btn">

                        Send Message

                    </button>

                </form>

            </div>

        </div>

    </section>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
